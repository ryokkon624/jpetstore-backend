server:
  port: 8080

spring:
  application:
    name: jpetstore-backend
  # AC4 (SBD-10): Spring Boot 4 で server.error.* は spring.web.error.* へ移動した
  # （org.springframework.boot.autoconfigure.web.WebProperties のネストプロパティ。Sprint Review 指摘対応）。
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false
  datasource:
    url: jdbc:mysql://localhost:3306/jpetstore_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
    # AC5/AC-neg1 (SBD-11): 秘密をソースに置かない。デフォルト値を持たせず、未設定なら起動失敗（fail-fast）。
    # ローカル開発は .env（gitignore対象）を参照。詳細は README「秘密管理（環境変数）」参照。
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  # AC5/AC-neg1 (SBD-11): 署名鍵もデフォルト値なし。未設定なら起動失敗（fail-fast）。最小鍵長は起動時に検証する。
  secret: ${JWT_SECRET}
  access-token-ttl: PT15M
  refresh-token-ttl: P7D
  cookie:
    # SPA が same-site で配信されない場合は Lax に切り替える（README 参照）。
    same-site: Strict
    secure: true

auth:
  # #20 AC1 (SBD-6): レート制限/ロックアウト。username単位で連続失敗を数え、閾値到達で一定時間ロックする。
  # env上書き可（例: AUTH_LOCKOUT_MAX_ATTEMPTS / AUTH_LOCKOUT_LOCK_DURATION）。
  lockout:
    max-attempts: 5
    lock-duration: PT15M
