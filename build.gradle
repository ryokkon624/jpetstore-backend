plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.example.jpetstore'
version = '0.0.1-SNAPSHOT'
description = 'jpetstore-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }

    mybatisGenerator

    // [L2] #48 Q2: legacy HSQLDB(1.8.0.10)への直結読み出し専用。testImplementationには入れない
    // (既存IT26本のclasspath・Spring Bootの組み込みDB判定への影響を避けるため)。
    parityLegacyJdbc
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // AOP（WHOカラム自動付与のアスペクトで使用）
    implementation 'org.aspectj:aspectjweaver'

    // JWT (jjwt) — JWT httpOnly Cookie 認証で使用（AC6: 0.11.5 は EOL 傾向のため 0.12.6 に更新）
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // MySQL Driver
    runtimeOnly 'com.mysql:mysql-connector-j:9.5.0'

    // MyBatis Generator（スキーマ → entity/mapper 生成）
    mybatisGenerator 'com.mysql:mysql-connector-j:9.5.0'
    mybatisGenerator 'org.mybatis.generator:mybatis-generator-core:1.4.2'

    // テスト系
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.1.0'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'

    // Spock（Groovy 5 用）
    testImplementation platform('org.spockframework:spock-bom:2.4-groovy-5.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.spockframework:spock-spring'

    // Testcontainers（統合テスト用）
    testImplementation 'org.testcontainers:mysql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway'
    testImplementation 'org.flywaydb:flyway-mysql'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // [L2] #48 Q2: captureGolden専用のlegacy HSQLDBドライバ(testImplementationには入れない)。
    parityLegacyJdbc 'hsqldb:hsqldb:1.8.0.10'
}

// UT用タスク（integration タグは除外）
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    finalizedBy jacocoTestReport
}

// IT用タスク（integration タグのみ。Testcontainers で Docker が必要）
// [L2] #48 AC11: parityタグは二重実行を避けるため除外する(parityTestが別途担当する)。
tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs integration tests (Testcontainers, requires Docker).'
    useJUnitPlatform {
        includeTags 'integration'
        excludeTags 'parity'
    }
    shouldRunAfter test
}

// [L2] #48 AC11/AC12: L2パリティ検証専用タスク。dual-tag(integration+parity)のSpecのみを対象にする。
// legacy起動は不要(golden JSONとのみ比較・AC12)。checkには載せない(当面ローカル/手動ゲート)。
tasks.register('parityTest', Test) {
    group = 'verification'
    description = '[L2] Runs parity specs against committed golden JSON (Testcontainers, requires Docker; legacy NOT required).'
    useJUnitPlatform {
        includeTags 'parity'
    }
    shouldRunAfter integrationTest
}

check {
    dependsOn integrationTest
}

tasks.register('mybatisGenerator', JavaExec) {
    group = 'mybatis'
    description = 'Run MyBatis Generator'

    classpath = configurations.mybatisGenerator
    mainClass = 'org.mybatis.generator.api.ShellRunner'

    args = [
            '-configfile', 'src/main/resources/generator/generatorConfig.xml',
            '-overwrite'
    ]
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
}

// [L2] #48 AC6/AC7: legacyを実際に駆動しgolden JSONを生成する手動実行タスク(legacy起動が前提)。
// システムプロパティ(-Dparity.legacy.baseUrl等)で接続先を差し替え可能(F2)。
tasks.register('captureGolden', JavaExec) {
    group = 'verification'
    description = '[L2] Drive legacy and (re)generate golden JSON (requires legacy running).'

    classpath = sourceSets.test.runtimeClasspath + configurations.parityLegacyJdbc
    mainClass = 'com.example.jpetstore.backend.parity.capture.LegacyCaptureTool'
    systemProperties = System.properties.findAll { k, v -> k.toString().startsWith('parity.') }
}

tasks.register('generateEnums', JavaExec) {
    group = 'codegen'
    description = 'Generate enum classes from m_code'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.jpetstore.backend.tool.EnumGenerator'
}

// 統合テスト用スキーマ SQL を jpetstore-database（兄弟ディレクトリ）から同期する。
// src/test/resources/flyway/sql/README.md 参照。
tasks.register('syncTestSchema', Copy) {
    group = 'verification'
    description = 'Sync test schema SQL from ../jpetstore-database/flyway/sql'

    from('../jpetstore-database/flyway/sql') {
        include '*.sql'
    }
    into 'src/test/resources/flyway/sql'
}

spotless {
    java {
        // Google Java Format を使用
        googleJavaFormat('1.32.0')
    }
}
